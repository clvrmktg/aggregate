{{- if .IsHome -}}
<script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "url": "{{ .Permalink }}",
    "name": "{{ .Site.Title }}",
    "description": "{{ .Description }}",
    "publisher": {
      "@type": "Organization",
      "name": "{{ .Site.Title }}",
      "url": "{{ .Permalink }}",
      "sameAs": [
        {{ .Site.Params.social.youtube | jsonify | safeJS }}
      ]
    }
  }
</script>
{{- end -}}
